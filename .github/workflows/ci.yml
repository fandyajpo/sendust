name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this candidate to npm (irreversible)"
        type: boolean
        default: false
      distTag:
        description: "Set this npm dist-tag on the current version after it is published (for example latest)"
        type: string
        default: ""
      hash:
        description: "Build the facade and print its tarball hash; publishes nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the build toolchain and its components;
      # `rustup show` installs exactly that toolchain.
      - name: Verify pinned Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Proves the core needs neither Node headers nor the NAPI crate.
      - name: Core-only unit tests
        run: cargo test -p sendust-core --all-targets --locked

      - name: Fake SMTP harness self-tests
        run: cargo test -p sendust-core --test harness_self_test --locked

      - name: Verify committed TLS fixtures
        run: |
          cd tests/fixtures/tls
          openssl verify -CAfile ca.crt -verify_hostname localhost valid-server.crt
          ! openssl verify -CAfile ca.crt self-signed.crt
          ! openssl verify -CAfile ca.crt expired.crt
          ! openssl verify -CAfile ca.crt -verify_hostname localhost wrong-host.crt
          ! openssl verify -CAfile ca.crt incomplete-chain.crt
          ! openssl x509 -in malformed.pem -noout

      - name: Native binding compiles
        run: cargo check -p sendust-napi --all-targets --locked

      - name: Workspace Rust tests
        run: cargo test --workspace --all-targets --locked

  checks:
    name: Architecture and documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned Rust toolchain
        run: |
          rustup show
          cargo metadata --format-version 1 --no-deps --locked > /dev/null

      - name: Architecture and module boundaries
        run: node scripts/check-architecture.mjs

      - name: Documentation structure
        run: node scripts/check-docs.mjs

      - name: Documentation claims
        run: node scripts/check-doc-claims.mjs

      - name: Version consistency
        run: node scripts/check-versions.mjs

      - name: Secret scan self-test
        run: node scripts/check-secrets.mjs --selftest

      - name: Secret scan
        run: node scripts/check-secrets.mjs

  typescript:
    name: TypeScript (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.5", "24.22.3", "26.13.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Pin npm
        run: |
          npm install --global npm@12.2.2
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript lint
        run: npm --workspace ./ts run lint

      - name: TypeScript formatting
        run: npm --workspace ./ts run format:check

      - name: TypeScript typecheck
        run: npm --workspace ./ts run typecheck

      - name: TypeScript unit and contract tests
        run: npm --workspace ./ts run test

  binding:
    name: Native binding (Node.js 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned Rust toolchain
        run: rustup show

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"

      - name: Pin npm
        run: |
          npm install --global npm@12.2.2
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and stage the addon
        run: npm run build:native

      - name: Binding tests
        run: npm --workspace ./ts run test

      # The P15-001 guide's snippets are executed here, so a doc change that no
      # longer matches the package fails the build.
      - name: Build the facade for the documentation sample
        run: npm --workspace ./ts run build

      - name: Quick start documentation sample
        run: node tests/docs/quickstart.mjs

      - name: Forced-GC probe
        run: node --expose-gc tests/runtime/gc.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      - name: Runtime smoke (Node.js)
        run: node tests/runtime/smoke.mjs

      - name: Runtime smoke (Bun)
        run: bun tests/runtime/smoke.mjs

      - name: Runtime smoke (Deno)
        run: deno run --allow-ffi --allow-read --allow-net tests/runtime/smoke.mjs

  bun:
    name: Bun runtime-neutral smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Proves the shared TypeScript entry point stays runtime-neutral. Native
      # addon loading and send/close behavior are gated by P05/P14.
      - name: Run shared TypeScript entry point
        run: bun run ts/src/index.ts

  deno:
    name: Deno runtime-neutral smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - name: Type-check shared TypeScript entry point
        run: deno check --node-modules-dir=manual ts/src/index.ts
      - name: Run shared TypeScript entry point
        run: deno run --allow-ffi --node-modules-dir=manual ts/src/index.ts

  artifacts:
    name: Native artifact (${{ matrix.target }})
    # Each runner builds and loads its own target: no cross-compilation
    # (ADR-0020). A missing binary here means the platform is not supported.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: macos-arm64
          # An Intel runner, so macos-x64 is built and loaded natively rather
          # than cross-compiled (no cross-built binary counts).
          - runner: macos-15-intel
            target: macos-x64
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    # A hung smoke must fail the matrix row instead of stalling the workflow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned Rust toolchain
        run: rustup show

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"

      - name: Build the native artifact
        run: node scripts/build-artifact.mjs

      - name: Load the artifact
        shell: bash
        run: |
          node -e "
            const { readdirSync } = require('node:fs');
            const file = readdirSync('artifacts').find((name) => name.endsWith('.node'));
            if (!file) throw new Error('no artifact produced');
            const addon = require('./artifacts/' + file);
            if (!addon.Transport) throw new Error('no Transport export in ' + file);
            console.log('loaded', file);
          "

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      # The package build bundles this addon, and the behaviour suite loads it as
      # the bundled path, so both run against this runner's own binary.
      - name: Stage the artifact as the bundled addon
        shell: bash
        run: cp artifacts/*.node ts/sendust.node

      - name: Build the facade package
        run: npm --workspace ./ts run build

      # The published tarball must declare the platform packages, which cannot
      # live in the repo manifest because npm needs lock entries for them.
      - name: Publish manifest
        run: node scripts/prepare-publish.mjs

      # Checksums, dependency inventory and provenance for this runner's
      # artifact; no publication action.
      - name: Release evidence
        run: node scripts/assemble-rc.mjs

      # The behaviour suite runs once per target, so accepted send, BUSY, close
      # and the limit negatives are proven on each platform rather than only on
      # Linux x64 (P14-004).
      - name: Per-target behaviour suite
        run: npm --workspace ./ts run test

      # Installed before the consumer check so the packed tarball is exercised
      # on Bun and Deno as well as Node.js for this target (R-041, R-042).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      # Installs the artifact as a per-platform package beside the packed facade
      # in a fresh consumer, so the loader's fallback path (ADR-0020) is
      # exercised on this runner's OS and arch instead of the bundled addon. The
      # tarball has no addon of its own, which is the published layout.
      - name: Resolve the artifact through the published layout
        run: node scripts/verify-platform.mjs

      - name: Runtime smoke (Bun)
        run: bun tests/runtime/smoke.mjs

      - name: Runtime smoke (Deno)
        run: deno run --allow-ffi --allow-read --allow-net tests/runtime/smoke.mjs

      # The facade, not just a direct require, must reach the addon through
      # `src/loader.ts` on every claimed runtime (P14-004).
      - name: Facade smoke (Node.js)
        run: node tests/runtime/facade.mjs

      - name: Facade smoke (Bun)
        run: bun tests/runtime/facade.mjs

      - name: Facade smoke (Deno)
        run: deno run --allow-ffi --allow-read --allow-net tests/runtime/facade.mjs

      # The full outcome contract per runtime: accepted, rejected, unknown, BUSY,
      # close, the attachment cap, and TLS failing closed.
      - name: Behaviour harness (Node.js)
        run: node tests/runtime/behaviour.mjs

      - name: Behaviour harness (Bun)
        run: bun tests/runtime/behaviour.mjs

      - name: Behaviour harness (Deno)
        run: deno run --allow-ffi --allow-read --allow-net tests/runtime/behaviour.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: sendust-${{ matrix.target }}
          path: artifacts/*.node
          if-no-files-found: error

  # Linux musl is a native target, not a cross-build: the container *is* the
  # musl userland, so the same runner compiles and loads the binary it ships
  # (ADR-0020). Alpine is the default small Node image, and without these
  # packages an install there fails closed with CONFIG_NATIVE_UNAVAILABLE.
  artifacts-musl:
    name: Native artifact (musl, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64-musl
          - runner: ubuntu-24.04-arm
            target: linux-arm64-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The musl userland is the image, not a cross toolchain: the binary is
      # compiled and loaded inside it (ADR-0020). GitHub's Alpine container jobs
      # cover x64 only, so both architectures use the same explicit docker run
      # and the JavaScript actions stay on the host.
      - name: Build and verify inside the musl image
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            node:22.23.5-alpine \
            sh scripts/ci-musl.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sendust-${{ matrix.target }}
          path: artifacts/*.node
          if-no-files-found: error

  # Assembles one release-candidate bundle from every target's artifact, so the
  # candidate has the complete hash set instead of per-job fragments. No
  # publication action.
  rc:
    name: Release candidate bundle
    needs: [artifacts, artifacts-musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"

      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          pattern: sendust-*
          merge-multiple: true
          path: artifacts

      - name: Install the facade toolchain
        run: npm ci --no-audit --no-fund

      # `dist` is platform-independent. One downloaded addon satisfies the
      # package build's bundled-addon step, and no tarball produced here ships
      # it: each platform package carries its own binary.
      - name: Stage an addon for the facade build
        run: cp artifacts/sendust-linux-x64-gnu.node ts/sendust.node

      - name: Build the facade
        run: npm --workspace ./ts run build

      # Downloaded artifacts predate this job's checkout, so the staleness check
      # is skipped here; each artifact job guards its own fresh build.
      - name: Assemble the candidate bundle
        run: node scripts/assemble-rc.mjs --require-all --allow-stale

      # Publication pushes exactly these tarballs, so the bundle carries them
      # and their hashes instead of leaving the step to a release operator.
      - name: Pack the platform packages
        run: node scripts/pack-platform.mjs --require-all

      - name: Show the artifact checksums
        run: |
          cat artifacts/release/*/SHA256SUMS
          cat artifacts/release/*/PLATFORM-PACKAGES.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release
          if-no-files-found: error

  # Dispatch-only and publishing nothing: builds the facade exactly as the
  # publish job does and prints its sha256, so `release/<version>/approved.json`
  # can be pinned from a CI build. The facade tarball is not byte-identical
  # across operating systems, so a laptop hash is refused by the publish job.
  facade-hash:
    name: Facade hash
    if: github.event_name == 'workflow_dispatch' && inputs.hash
    needs: artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"

      - name: Pin npm
        run: |
          npm install --global npm@12.2.2
          npm --version

      - name: Download the linux artifact for the facade build
        uses: actions/download-artifact@v4
        with:
          name: sendust-linux-x64
          path: artifacts

      - name: Install the facade toolchain
        run: npm ci --no-audit --no-fund

      - name: Stage an addon for the facade build
        run: cp artifacts/sendust-linux-x64-gnu.node ts/sendust.node

      - name: Build the facade and its publish manifest
        run: |
          npm --workspace ./ts run build
          node scripts/prepare-publish.mjs

      - name: Print the facade tarball hash
        run: |
          sha256sum artifacts/publish/sendust-ts-*.tgz
          echo "Pin this value in release/<version>/approved.json as facade.sha256"

  # Publishes the candidate the `rc` job just verified. Manual and explicit: it
  # runs only on a workflow_dispatch with `publish` checked, and the script
  # refuses unless the bundle's provenance names the approved commit, every
  # tarball matches the run's hashes, every packed binary is that run's artifact,
  # and every byte-reproducible target matches `release/<version>/approved.json`.
  publish:
    name: Publish the release candidate
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: rc
    runs-on: ubuntu-24.04
    # Trusted publishing: npm exchanges this workflow's OIDC token for a
    # short-lived publish credential and attaches a provenance attestation. It
    # needs `id-token: write`, a public repository, npm >= 11.5.1, and no
    # long-lived npm token in the environment.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      # Full history: the publisher compares this commit's build inputs with the
      # approved commit's, so the approved commit must be reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; the runner image ships older.
      - name: Pin npm for trusted publishing
        run: |
          npm install --global npm@12.2.2
          npm --version

      # A leftover NODE_AUTH_TOKEN would silently win over OIDC, so the run
      # refuses one. The request URL only exists when `id-token: write` is on.
      - name: Verify OIDC publishing is available
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set; trusted publishing must run without it"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no OIDC request URL; the publish job needs id-token: write"
            exit 1
          fi
          echo "OIDC available; npm will exchange it for a short-lived credential"

      - name: Download the candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release

      # The facade build needs an addon staged, and `dist` is platform
      # independent, so this target's binary is enough. It is not published from
      # here: the platform tarballs in the bundle are.
      - name: Download the linux artifact for the facade build
        uses: actions/download-artifact@v4
        with:
          name: sendust-linux-x64
          path: artifacts

      - name: Install the facade toolchain
        run: npm ci --no-audit --no-fund

      - name: Stage an addon for the facade build
        run: cp artifacts/sendust-linux-x64-gnu.node ts/sendust.node

      - name: Build the facade and its publish manifest
        run: |
          npm --workspace ./ts run build
          node scripts/prepare-publish.mjs

      - name: Publish the seven packages
        run: |
          VERSION=$(node -p "require('./ts/package.json').version")
          TAG=$(VERSION="$VERSION" node -p "require('./release/' + process.env.VERSION + '/approved.json').distTag")
          echo "publishing $VERSION with dist-tag $TAG"
          node scripts/publish-release.mjs --tag "$TAG"

  # A published version is immutable, so a dist-tag that was set wrongly at
  # publish time can only be corrected by moving the tag, never by republishing.
  # This job is manual and does exactly that for the version in the tree.
  dist-tag:
    name: Set a dist-tag on the published version
    if: github.event_name == 'workflow_dispatch' && inputs.distTag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          registry-url: "https://registry.npmjs.org"

      - name: Check the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set; add it as a repository secret"
            exit 1
          fi
          npm whoami

      - name: Move the dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./ts/package.json').version")
          npm view "@sendust/ts@$VERSION" version
          npm dist-tag add "@sendust/ts@$VERSION" "${{ inputs.distTag }}"
          npm view @sendust/ts dist-tags
