[package]
name = "sendust-napi"
description = "Thin Node-API inbound adapter for the Sendust core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Path-only: both crates are unpublished workspace members, so the version is
# tracked once in the workspace manifest instead of in a second pin here.
sendust-core = { path = "../sendust-core" }
napi.workspace = true
napi-derive.workspace = true
tokio.workspace = true

[build-dependencies]
napi-build.workspace = true
