[package]
name = "sendust-core"
description = "Runtime-independent Sendust email delivery core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
lettre.workspace = true
idna.workspace = true
base64.workspace = true
tokio.workspace = true
rustls.workspace = true

[dev-dependencies]
# Test builds need the runtime itself; the library only needs the timer.
tokio = { workspace = true, features = ["rt", "macros"] }
