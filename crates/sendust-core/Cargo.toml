[package]
name = "sendust-core"
description = "Runtime-independent Sendust email delivery core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
idna.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
# Independent MIME parser for conformance tests only (P07-005). Test-only: it
# never ships and it re-parses the emitted bytes with a second implementation.
mail-parser.workspace = true
# Test builds need the runtime itself; the library only needs the timer.
tokio = { workspace = true, features = ["rt", "macros"] }
