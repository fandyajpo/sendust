[workspace]
resolver = "3"
members = ["crates/sendust-core", "crates/sendust-napi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Dev-only differential oracle for the P06 migration (ADR-0017). Sendust owns
# its SMTP engine; lettre stays reachable from `sendust-core` dev-dependencies
# to prove behavioural parity and must never return to the production graph.
lettre = { version = "=0.11.23", default-features = false, features = [
  "smtp-transport",
  "tokio1-rustls",
  "ring",
  "webpki-roots",
] }

# Transfer encoding for MIME bodies and parts and the AUTH challenge responses.
# ADR-0010 requires vetted primitives rather than a hand-rolled encoder.
base64 = { version = "=0.23.1" }

# IDNA (UTS #46) domain conversion for envelope addresses. Pinned directly so
# the core cannot drift from the conversion the address model was built on.
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }

# TLS error classification in the native client and the TLS test harness.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "ring"] }

# Deadline enforcement and I/O for the native SMTP client, plus the async test
# runtime. Core never builds a runtime, it only uses the caller's timer.
tokio = { version = "=1.54.1", default-features = false, features = [
  "time",
  "sync",
  "net",
  "io-util",
] }

# Async TLS for the native SMTP client (ADR-0017); rustls stays the TLS engine.
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12"] }

# Bundled Mozilla roots for the native client's trust store (ADR-0003).
webpki-roots = { version = "=1.0.12" }

# rustls key/certificate types used by the native client (already transitive).
rustls-pki-types = { version = "=1.16.0" }

# Node-API 8 binding surface, used by sendust-napi only.
napi = { version = "=3.16.2", features = ["napi8", "async"] }
napi-derive = "=3.7.0"
napi-build = "=2.6.0"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
