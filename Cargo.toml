[workspace]
resolver = "3"
members = ["crates/sendust-core", "crates/sendust-napi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
# SMTP transport, TLS and authentication only. lettre's default `pool` and
# `native-tls` features are deliberately excluded; see dependency policy.
lettre = { version = "=0.11.23", default-features = false, features = [
  "smtp-transport",
  "tokio1-rustls",
  "ring",
  "webpki-roots",
] }

# Transfer encoding for MIME bodies and parts. ADR-0010 requires vetted
# primitives rather than a hand-rolled encoder; already present via lettre.
base64 = { version = "=0.23.1" }

# IDNA (UTS #46) domain conversion for envelope addresses. Already present
# transitively via lettre/url; pinned directly so core cannot drift from it.
idna = { version = "=1.1.0", default-features = false, features = ["std", "compiled_data"] }

# Node-API 8 binding surface, used by sendust-napi only.
napi = { version = "=3.16.2", features = ["napi8", "async"] }
napi-derive = "=3.7.0"
napi-build = "=2.6.0"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
